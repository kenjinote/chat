apiVersion: 2019-12-01
location: japaneast
name: chat-server-b
properties:
  containers:
  - name: chat-server-b
    properties:
      image: your-registry.azurecr.io/chat-server:v11
      command:
        - ./chat_server
        - chat-sfu-b-2026.japaneast.azurecontainer.io:4000
        - tcp://your-redis-host.example.com:6379
      resources:
        requests:
          cpu: 1.0
          memoryInGB: 1.0
      ports:
      - port: 4000
        protocol: TCP
      - port: 4001
        protocol: UDP
  osType: Linux
  ipAddress:
    type: Public
    ports:
    - protocol: TCP
      port: 4000
    - protocol: UDP
      port: 4001
    dnsNameLabel: chat-sfu-b-2026
  imageRegistryCredentials:
  - server: your-registry.azurecr.io
    username: your-registry
    password: REDACTED_ACR_PASSWORD